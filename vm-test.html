<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScratchYouTube V0.2 - VM Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f5f5f5; }
    main { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 16px; }
    #status { font-weight: 700; }
    pre { background: #111; color: #eee; padding: 16px; border-radius: 10px; white-space: pre-wrap; }
    a { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>ScratchYouTube V0.2</h1>
    <p id="status">Scratch VM 起動中...</p>
    <p>Scratch VMをこのページ自身に読み込み、fetch hookと同じページで動かすテスト。</p>
    <pre id="vm-log">待機中...</pre>
    <a href="./">← V0.1に戻る</a>
  </main>

  <script src="hook.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@scratch/scratch-vm/dist/web/scratch-vm.js"></script>
  <script>
    const status = document.getElementById('status');
    const log = document.getElementById('vm-log');

    try {
      if (typeof window.VirtualMachine !== 'function') {
        throw new Error('VirtualMachine が見つかりません');
      }

      const vm = new window.VirtualMachine();
      window.scratchVM = vm;

      status.textContent = '🟢 Scratch VM 起動成功';
      log.textContent =
        'VirtualMachine: OK\n' +
        'fetch hook: ' + (window.__scratchYouTubeFetchHook ? 'OK' : 'NG') + '\n\n' +
        '次の段階でScratch GUIと接続します。';
    } catch (error) {
      status.textContent = '🔴 Scratch VM 起動失敗';
      log.textContent = String(error.stack || error);
    }
  </script>
</body>
</html>
